spring:
  application:
    name: eureka-server

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    # Standalone mode: don't self-register and don't fetch peer registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Accept registrations immediately on startup without waiting for peers to sync
    wait-time-in-ms-when-sync-empty: 0
    # Disable self-preservation in dev so stale instances are evicted quickly
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
